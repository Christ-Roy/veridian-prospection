# Deploy staging — Veridian Prospection  (modèle gitops Nomad SSH-bastion)
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  PATRON DE RÉFÉRENCE — les autres apps Veridian copient ce workflow.       │
# │  Doc complète : deploy/README.md (schéma de flux, secrets, rollback).      │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Pipeline staging-first, 100 % gitops Nomad :
#   1. quality  : gate bloquant (lint, typecheck, unit, audit, test-mapping)   INCHANGÉ
#   2. build    : Docker buildx → push GHCR (tag staging-<sha> + staging-latest) INCHANGÉ
#   3. deploy   : SSH → bastion Nomad, en VERBES CONTRAINTS (put-job, deploy,
#                 put-migrations, migrate, cleanup). Le pré-pull, le plan, le
#                 `run -detach -check-index`, le suivi du DeploymentID et le
#                 `prisma migrate deploy` sont exécutés PAR LE BASTION.           NOUVEAU
#   4. smoke    : rejoint le tailnet + curl staging.veridian.site health/auth/login.
#                 (Le dashboard-crawler Playwright est retiré — cf note en fin de
#                  fichier ; il dépendait de la topologie compose morte.)
#
# Modèle de déploiement, SSH-bastion à COMMANDE FORCÉE (constat C4, 2026-08-29) :
#   La clé CI n'ouvre plus de shell sur le bastion. Sa ligne d'authorized_keys
#   porte `command="/usr/local/sbin/veridian-ci-deploy prospection"` : le serveur
#   fixe l'application, la CI ne fournit que le verbe, le tier et le tag, tous
#   validés par motif strict (tout le reste sort en code 64). Une clé de CI ne
#   vaut donc plus root sur le nœud, et ne peut plus lire le jeton management
#   Nomad. Contrat complet : veridian/secrets-migration/C4-CONTRAT-CI.md.
#   Le NOMAD_TOKEN ne quitte JAMAIS le bastion. Le control-plane Nomad ordonnance l'alloc
#   sur ovh-dev (== dev-pub, `constraint provider=ovh-dev`). Aucun token, aucune
#   URL de DB, aucun secret applicatif ne transite par le runner GitHub — les
#   secrets app vivent dans la Nomad Variable `nomad/jobs/prospection-staging`,
#   injectés côté cluster par `template{ env = true }`.
#
# Migrations Prisma — la CI ne migre PAS depuis le runner (la DB est co-localisée
# dans le namespace réseau de l'alloc, injoignable hors de ce namespace). La CI
# pousse l'archive prisma/ sur stdin (`put-migrations staging`) puis demande
# `migrate staging` ; le bastion route vers dev-pub et y lance un container
# node:22-alpine éphémère qui joint `--network container:db-<alloc>`. Il est
# idempotent : prod+staging sont déjà baselinés (_prisma_migrations 31/31), donc
# no-op au premier run, et il n'appliquera QUE les futures migrations. C'est un
# gate de sécurité qui garantit le schéma à jour à chaque deploy — PAS un
# recâblage du migrate auto interdit par le §20 (le §20 vise le migrate depuis
# le runner GHA ; ici on migre in situ, sur fenêtre de deploy contrôlée, DB de
# l'alloc). Cf. deploy/README.md §Migrations.

name: Prospection Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'image à (re)déployer sans rebuild (ex: staging-abc1234). Vide = build du HEAD."
        required: false
        default: ""

concurrency:
  group: deploy-staging-prospection
  cancel-in-progress: false  # un deploy en cours ne doit pas être interrompu

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/prospection
  STAGING_HOST: prospection.staging.veridian.site
  # Le nom du job Nomad n'est plus une variable de CI : il est fixé dans la
  # table serveur du bastion (app+tier -> job). Seul le HCL à envoyer reste ici.
  JOB_FILE: deploy/prospection-staging.nomad.hcl

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1. QUALITY GATE — INCHANGÉ (bloquant, gate le build)
  # ══════════════════════════════════════════════════════════════════════════
  quality:
    name: Quality gate (lint + typecheck + unit + audit + test-mapping)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history pour test-mapping vs origin/main
          submodules: recursive  # shared/ submodule veridian-infra
          # veridian-infra est PRIVÉ → le GITHUB_TOKEN par défaut (scopé au seul
          # repo courant) ne peut PAS cloner le submodule. CR_PAT = PAT cross-repo.
          token: ${{ secrets.CR_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: eslint src/
        run: npx eslint src/ --quiet

      - name: vitest unit
        run: npx vitest run src/

      - name: npm audit (high+critical bloquant)
        run: npm audit --audit-level=high --omit=dev

      - name: test-mapping check (vs origin/main)
        env:
          BASE_REF: origin/main
        run: bash scripts/ci/check-test-mapping.sh

  # ══════════════════════════════════════════════════════════════════════════
  # 2. BUILD + PUSH GHCR — INCHANGÉ (expose outputs.sha7 pour les jobs suivants)
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build + push GHCR (staging-<sha>)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # SHA short (7 chars) — match docker/metadata-action default pour type=sha
      sha7: ${{ steps.sha.outputs.sha7 }}
    steps:
      - id: sha
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo pour le submodule privé veridian-infra

      - name: Plafonds ressources staging
        run: python3 scripts/ci/check-staging-resources.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - id: build_time
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://api.app.veridian.site
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_HUB_URL=https://app.veridian.site
            NEXT_PUBLIC_SITE_URL=https://prospection.staging.veridian.site
            NEXT_PUBLIC_TRIAL_DAYS=7
            COMMIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.build_time.outputs.built_at }}

  # ══════════════════════════════════════════════════════════════════════════
  # 3. DEPLOY NOMAD (SSH bastion) — remplace l'ancien deploy compose dev-pub
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Nomad staging (SSH bastion)
    needs: build
    runs-on: ubuntu-latest
    env:
      # Tag staging = staging-<sha7> (metadata type=sha,prefix=staging-).
      # workflow_dispatch peut forcer un tag existant (redeploy/rollback sans rebuild).
      IMAGE_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || format('staging-{0}', needs.build.outputs.sha7) }}
      # Cible SSH unique de tous les verbes. Plus aucun chemin distant côté CI :
      # le bastion range lui-même ce qu'il reçoit (commande forcée).
      BASTION: ${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}
    steps:
      - uses: actions/checkout@v6
        # Le HCL vit dans le repo (deploy/) — pas besoin du submodule ici.

      # ── Clé SSH dédiée CI vers le bastion Nomad (Contabo) ──────────────────
      # La publique de cette clé est dans ~brunon5/.ssh/authorized_keys du bastion.
      # Clé DÉDIÉE (≠ github-actions-deploy de dev-pub) : périmètre minimal.
      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Dépôt du HCL sur le bastion (verbe put-job) ───────────────────────
      # ⚠️ C'est le HCL DU REPO qui part (il DÉCLARE `variable "image_tag"`),
      # jamais la copie ~/nomad-veridian/jobs/ du bastion (plus vieille, sans le
      # bloc variable → `nomad job plan -var image_tag=…` échoue en "Undefined -var").
      # Le fichier arrive sur STDIN : la clé CI est en commande forcée, elle ne
      # peut plus choisir un chemin d'écriture sur le bastion. Le serveur refuse
      # d'ailleurs un HCL qui ne déclare pas le job attendu pour ce couple app/tier.
      - name: Dépose le HCL sur le bastion (put-job staging)
        run: |
          set -eo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$BASTION" "put-job staging" < "$JOB_FILE"

      # ── Déploiement (verbe deploy) ─────────────────────────────────────────
      # Une seule commande, tout le reste est CÔTÉ SERVEUR et n'a rien perdu :
      #   - pré-pull authentifié de l'image sur ovh-dev (le plugin docker de Nomad
      #     n'a pas de bloc auth : sans ce pré-pull, l'alloc reste pending sur un
      #     401 ghcr jusqu'au healthy_deadline (incident 2026-07-11) ;
      #   - `nomad job validate` puis `plan` ;
      #   - `run -detach -check-index` lié au Modify Index observé au plan ;
      #   - résolution du DeploymentID de CET eval puis `deployment status
      #     -monitor` sur CE déploiement précis (ni la race du poll, ni le 404
      #     transitoire du `job run` bloquant).
      # Le NOMAD_TOKEN est sourcé sur le bastion et ne traverse plus la session SSH.
      - name: Déploie le job Nomad staging (deploy staging <tag>)
        run: |
          set -eo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$BASTION" "deploy staging $IMAGE_TAG"

      # ── Migrations Prisma (verbes put-migrations puis migrate) ─────────────
      # Le dossier prisma/ (schema + migrations) vit dans le repo, donc sur le
      # runner. Il part en tar.gz SUR STDIN vers le bastion, qui le route ensuite
      # vers ovh-dev et y lance un container éphémère joignant le namespace réseau
      # du container DB de l'alloc (`--network container:db-<alloc>`), ce qui
      # résout 127.0.0.1:5432 exactement comme le fait l'app.
      #
      # Le serveur migre LES DEUX bases : `prospection` (app staging) et
      # `prospection_devclone` (banc IA/x402). Ne pas dupliquer cette logique ici :
      # la liste des bases est dans la table serveur, pas dans le workflow.
      # Le mot de passe DB est lu in situ, il ne transite jamais par la CI.
      # `migrate deploy` est idempotent : il ne rejoue rien de déjà appliqué.
      - name: Dépose prisma/ sur le bastion (put-migrations staging)
        run: |
          set -eo pipefail
          tar czf - prisma | ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$BASTION" "put-migrations staging"

      - name: prisma migrate deploy (migrate staging)
        run: |
          set -eo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$BASTION" "migrate staging"

      # ── Nettoyage du matériel temporaire sur le bastion (verbe cleanup) ────
      - name: Nettoie le matériel déposé (cleanup staging)
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$BASTION" "cleanup staging" || true

      # La clé de déploiement n'a plus rien à faire sur le runner une fois le
      # job terminé, y compris quand une étape a échoué.
      - name: Efface la clé de déploiement du runner
        if: always()
        run: shred -u ~/.ssh/id_ed25519 2>/dev/null || rm -f ~/.ssh/id_ed25519

  # ══════════════════════════════════════════════════════════════════════════
  # 4. SMOKE — vérification applicative via l'ingress (staging privé → tailnet)
  # ══════════════════════════════════════════════════════════════════════════
  smoke:
    name: Smoke test staging
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Staging est derrière internal-only@nomad (ipAllowList 100.64/10) : le
      # curl échoue en 403 SANS tailscale. Le runner rejoint le tailnet Veridian.
      - name: Tailscale (connect runner to tailnet for staging smoke)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-github
          version: latest

      - name: GET /api/health (retry 6x/5s)
        run: |
          for i in $(seq 1 6); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://${{ env.STAGING_HOST }}/api/health" || echo "000")
            echo "[$i/6] /api/health → $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Smoke /api/health failed"
          exit 1

      - name: GET /api/auth/providers
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://${{ env.STAGING_HOST }}/api/auth/providers")
          [ "$CODE" = "200" ] || { echo "::error::auth providers → $CODE"; exit 1; }

      - name: GET /login (page render)
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://${{ env.STAGING_HOST }}/login")
          [ "$CODE" = "200" ] || { echo "::error::/login → $CODE"; exit 1; }

  # NOTE — le dashboard-crawler Playwright a été RETIRÉ de ce workflow.
  # Il dépendait de la topologie compose morte (réseau docker `staging-edge` +
  # DNS interne `postgres-staging:5432` pour seeder le compte canonique), qui
  # n'existe plus dans le modèle Nomad (la DB vit dans le namespace réseau de
  # l'alloc). Le crawler reste disponible en local/manuel, et la couverture E2E
  # lourde (scripts/e2e/staging-full.sh) demeure le gate team-lead avant promo
  # main (§20, exécuté à la main). Recâbler un crawler Nomad-aware = ticket
  # dédié si besoin (container Playwright joignant `--network container:db-<alloc>`).
