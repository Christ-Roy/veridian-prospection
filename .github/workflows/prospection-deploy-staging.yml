# Deploy staging — Veridian Prospection  (modèle gitops Nomad SSH-bastion)
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  PATRON DE RÉFÉRENCE — les autres apps Veridian copient ce workflow.       │
# │  Doc complète : deploy/README.md (schéma de flux, secrets, rollback).      │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Pipeline staging-first, 100 % gitops Nomad :
#   1. quality  : gate bloquant (lint, typecheck, unit, audit, test-mapping)   INCHANGÉ
#   2. build    : Docker buildx → push GHCR (tag staging-<sha> + staging-latest) INCHANGÉ
#   3. deploy   : SSH → bastion Nomad, scp du HCL, `nomad job plan`→`run -detach`,
#                 puis `prisma migrate deploy` (gate idempotent) via container
#                 éphémère joignant le namespace réseau de l'alloc DB.           NOUVEAU
#   4. smoke    : rejoint le tailnet + curl staging.veridian.site health/auth/login.
#                 (Le dashboard-crawler Playwright est retiré — cf note en fin de
#                  fichier ; il dépendait de la topologie compose morte.)
#
# Modèle de déploiement — SSH-bastion (décision Robert, arrêtée) :
#   Le NOMAD_TOKEN ne quitte JAMAIS le bastion. La CI ouvre une session SSH vers
#   le bastion (clé dédiée CI), y dépose le HCL du repo, et lance les commandes
#   `nomad` en sourçant l'env in situ. Le control-plane Nomad ordonnance l'alloc
#   sur ovh-dev (== dev-pub, `constraint provider=ovh-dev`). Aucun token, aucune
#   URL de DB, aucun secret applicatif ne transite par le runner GitHub — les
#   secrets app vivent dans la Nomad Variable `nomad/jobs/prospection-staging`,
#   injectés côté cluster par `template{ env = true }`.
#
# Migrations Prisma — la CI ne migre PAS depuis le runner (la DB est co-localisée
# dans le namespace réseau de l'alloc, injoignable hors de ce namespace). Le
# `migrate deploy` tourne DEPUIS dev-pub (via le bastion) dans un container
# node:22-alpine éphémère qui joint `--network container:db-<alloc>`. Il est
# idempotent : prod+staging sont déjà baselinés (_prisma_migrations 31/31), donc
# no-op au premier run, et il n'appliquera QUE les futures migrations. C'est un
# gate de sécurité qui garantit le schéma à jour à chaque deploy — PAS un
# recâblage du migrate auto interdit par le §20 (le §20 vise le migrate depuis
# le runner GHA ; ici on migre in situ, sur fenêtre de deploy contrôlée, DB de
# l'alloc). Cf. deploy/README.md §Migrations.

name: Prospection Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag d'image à (re)déployer sans rebuild (ex: staging-abc1234). Vide = build du HEAD."
        required: false
        default: ""

concurrency:
  group: deploy-staging-prospection
  cancel-in-progress: false  # un deploy en cours ne doit pas être interrompu

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/prospection
  STAGING_HOST: prospection.staging.veridian.site
  # Nom du job Nomad (== `job "prospection-staging"` dans le HCL). Sert au poll
  # de déploiement et au ciblage de l'alloc DB pour le migrate.
  NOMAD_JOB: prospection-staging
  JOB_FILE: deploy/prospection-staging.nomad.hcl

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1. QUALITY GATE — INCHANGÉ (bloquant, gate le build)
  # ══════════════════════════════════════════════════════════════════════════
  quality:
    name: Quality gate (lint + typecheck + unit + audit + test-mapping)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history pour test-mapping vs origin/main
          submodules: recursive  # shared/ submodule veridian-infra
          # veridian-infra est PRIVÉ → le GITHUB_TOKEN par défaut (scopé au seul
          # repo courant) ne peut PAS cloner le submodule. CR_PAT = PAT cross-repo.
          token: ${{ secrets.CR_PAT }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: eslint src/
        run: npx eslint src/ --quiet

      - name: vitest unit
        run: npx vitest run src/

      - name: npm audit (high+critical bloquant)
        run: npm audit --audit-level=high --omit=dev

      - name: test-mapping check (vs origin/main)
        env:
          BASE_REF: origin/main
        run: bash scripts/ci/check-test-mapping.sh

  # ══════════════════════════════════════════════════════════════════════════
  # 2. BUILD + PUSH GHCR — INCHANGÉ (expose outputs.sha7 pour les jobs suivants)
  # ══════════════════════════════════════════════════════════════════════════
  build:
    name: Build + push GHCR (staging-<sha>)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # SHA short (7 chars) — match docker/metadata-action default pour type=sha
      sha7: ${{ steps.sha.outputs.sha7 }}
    steps:
      - id: sha
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra
          token: ${{ secrets.CR_PAT }}  # PAT cross-repo pour le submodule privé veridian-infra

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - id: build_time
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://api.app.veridian.site
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_HUB_URL=https://app.veridian.site
            NEXT_PUBLIC_SITE_URL=https://prospection.staging.veridian.site
            NEXT_PUBLIC_TRIAL_DAYS=7
            COMMIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.build_time.outputs.built_at }}

  # ══════════════════════════════════════════════════════════════════════════
  # 3. DEPLOY NOMAD (SSH bastion) — remplace l'ancien deploy compose dev-pub
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy Nomad staging (SSH bastion)
    needs: build
    runs-on: ubuntu-latest
    env:
      # Tag staging = staging-<sha7> (metadata type=sha,prefix=staging-).
      # workflow_dispatch peut forcer un tag existant (redeploy/rollback sans rebuild).
      IMAGE_TAG: ${{ github.event.inputs.image_tag != '' && github.event.inputs.image_tag || format('staging-{0}', needs.build.outputs.sha7) }}
      REMOTE_HCL: /tmp/prospection-staging-${{ github.run_id }}.nomad.hcl
    steps:
      - uses: actions/checkout@v6
        # Le HCL vit dans le repo (deploy/) — pas besoin du submodule ici.

      # ── Clé SSH dédiée CI vers le bastion Nomad (Contabo) ──────────────────
      # La publique de cette clé est dans ~brunon5/.ssh/authorized_keys du bastion.
      # Clé DÉDIÉE (≠ github-actions-deploy de dev-pub) : périmètre minimal.
      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ── Copie du HCL DU REPO vers le bastion ───────────────────────────────
      # ⚠️ On copie le HCL du repo (qui DÉCLARE `variable "image_tag"`), JAMAIS
      # la copie ~/nomad-veridian/jobs/ du bastion (plus vieille, sans le bloc
      # variable → `nomad job plan -var image_tag=…` échoue en "Undefined -var").
      - name: Copy HCL to bastion
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$JOB_FILE" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:$REMOTE_HCL"

      # ── plan (dry-run inoffensif) → run -detach ────────────────────────────
      # Binaire brut /usr/bin/nomad (PAS le wrapper nomad-v : ~/bin hors PATH
      # headless, et ses sous-commandes ne passent pas -var). Le token est
      # sourcé IN SITU sur le bastion — il ne transite jamais par la CI.
      - name: nomad job plan (dry-run) + run -detach
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REMOTE_HCL: ${{ env.REMOTE_HCL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' REMOTE_HCL='${REMOTE_HCL}' bash -s" <<'REMOTE'
          set -euo pipefail
          # Le NOMAD_MGMT_TOKEN est sourcé ici, sur le bastion, et exporté en
          # NOMAD_TOKEN (le fichier le nomme NOMAD_MGMT_TOKEN — subtilité).
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          # ── PRÉ-PULL authentifié sur le nœud cible (ovh-dev == dev-pub) ──────
          # Le plugin docker de Nomad n'a PAS de bloc auth → il ne peut pas puller
          # une image PRIVÉE ghcr (manifest HEAD → 401), et l'alloc reste pending
          # jusqu'au healthy_deadline (incident 2026-07-11). On pré-pull l'image
          # AVEC l'auth ghcr du nœud (docker login déjà en place) : quand Nomad
          # démarre la task, l'image est déjà locale → pas de pull non-auth.
          echo "== pré-pull image sur ovh-dev (auth ghcr du nœud) =="
          # -n IMPÉRATIF : sans lui, ce ssh lit le stdin du heredoc REMOTE et
          # AVALE les commandes nomad job validate/plan/run suivantes → elles ne
          # s'exécutent jamais (faux vert : la CI passe mais l'ancienne version
          # reste, incident 2026-07-11). -n redirige stdin depuis /dev/null.
          ssh -n -o BatchMode=yes -o ConnectTimeout=15 dev-pub \
            "docker pull ghcr.io/christ-roy/prospection:${IMAGE_TAG}"

          echo "== nomad job validate =="
          /usr/bin/nomad job validate -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"

          echo "== nomad job plan (diff, inoffensif) =="
          # plan renvoie exit 1 quand il y a des allocs à créer/modifier : c'est
          # by design, PAS une erreur → `|| true`. Le plan ne réserve rien.
          /usr/bin/nomad job plan -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" || true

          # run BLOQUANT (SANS -detach) : nomad monitore le déploiement de CE
          # nouveau job et ne rend la main qu'à la fin — exit 0 si la nouvelle
          # version devient healthy, exit ≠0 si elle échoue/auto-revert. On évite
          # ainsi la RACE du `job status` (qui pouvait lire "successful" de
          # l'ANCIEN déploiement avant que le nouveau ne s'enregistre → faux vert,
          # incident 2026-07-11). Le pré-pull garantit un démarrage rapide.
          echo "== nomad job run (bloquant, monitore le déploiement) image_tag=${IMAGE_TAG} =="
          /usr/bin/nomad job run -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"
          REMOTE

      # ── Pousse prisma/ vers le bastion (matériel du migrate) ───────────────
      # Le dossier prisma/ (schema + migrations) vit dans le repo, donc sur le
      # runner. Le migrate container tournera sur dev-pub (où est l'alloc DB) ;
      # on route le dossier via le bastion (seul hôte que la CI peut SSH). On
      # empaquète prisma/ en tar et on le dépose sur le bastion.
      - name: Ship prisma/ to bastion
        run: |
          tar czf /tmp/prisma-${{ github.run_id }}.tgz prisma
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "/tmp/prisma-${{ github.run_id }}.tgz" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:/tmp/prisma-${{ github.run_id }}.tgz"

      # ── Prisma migrate deploy (gate idempotent) ────────────────────────────
      # La DB staging est co-localisée avec l'app dans le namespace réseau de
      # l'alloc, SUR ovh-dev (dev-pub). Injoignable depuis le runner GHA ET
      # depuis le bastion en direct → le bastion (qui peut ssh dev-pub) pousse
      # prisma/ sur dev-pub et y lance un container node:22-alpine qui JOINT le
      # namespace du container DB de l'alloc (`--network container:db-<alloc>`),
      # ce qui résout 127.0.0.1:5432 exactement comme l'app.
      #
      # Idempotent : migrate deploy skip les migrations déjà dans _prisma_migrations
      # (staging = 31/31 baseline → no-op au 1er run). Le mot de passe DB est lu
      # IN SITU depuis l'env du container postgres (jamais dans la CI). Tout le
      # matériel temporaire est nettoyé en fin de step.
      - name: Prisma migrate deploy (DB de l'alloc, via bastion→dev-pub)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "NOMAD_JOB='${{ env.NOMAD_JOB }}' RUN_ID='${{ github.run_id }}' bash -s" <<'REMOTE'
          set -euo pipefail
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          # Alloc running du job + le nœud qui la porte (== dev-pub pour staging).
          ALLOC=$(/usr/bin/nomad job allocs -json "$NOMAD_JOB" \
            | python3 -c 'import sys,json;a=json.load(sys.stdin);print([x["ID"] for x in a if x["ClientStatus"]=="running"][0])')
          echo "alloc running: $ALLOC"
          # Container DB de l'alloc = `db-<allocID complet>` (task "db").
          DB_CT=$(/usr/bin/nomad alloc status -json "$ALLOC" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["ID"])')
          DB_CT="db-${DB_CT}"
          echo "db container: $DB_CT"

          WORK="/tmp/prosp-migrate-${RUN_ID}"
          # Le bastion pousse prisma/ + le nom du container DB à dev-pub, puis y
          # lance le migrate. dev-pub résout le container par son nom `db-<alloc>`.
          # On passe DB_CT/WORK en variables d'environnement de la session SSH
          # (pas de heredoc imbriqué fragile) et le script dev-pub est en quotes
          # simples → aucune expansion prématurée côté bastion.
          # -n : sinon ce ssh avale le stdin du heredoc REMOTE (scp + migrate ci-dessous).
          ssh -n -o BatchMode=yes -o ConnectTimeout=15 dev-pub "rm -rf '$WORK' && mkdir -p '$WORK'"
          scp /tmp/prisma-${RUN_ID}.tgz "dev-pub:${WORK}/prisma.tgz"
          ssh -o BatchMode=yes dev-pub \
            "DB_CT='$DB_CT' WORK='$WORK' bash -s" <<'DEVPUB'
          set -euo pipefail
          cd "$WORK" && tar xzf prisma.tgz
          DB_PASS=$(docker exec "$DB_CT" printenv POSTGRES_PASSWORD)
          docker run --rm \
            --network "container:$DB_CT" \
            -v "$WORK/prisma:/app/prisma" \
            -w /app \
            -e DATABASE_URL="postgresql://app:$DB_PASS@127.0.0.1:5432/prospection?connection_limit=5" \
            node:22-alpine sh -c 'apk add --no-cache openssl >/dev/null && npm i -g prisma@6.19.2 --silent && prisma migrate deploy'
          rm -rf "$WORK"
          DEVPUB

          rm -f /tmp/prisma-${RUN_ID}.tgz
          REMOTE

      # ── Nettoyage du matériel temporaire sur le bastion ────────────────────
      - name: Cleanup remote HCL
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "rm -f '$REMOTE_HCL' '/tmp/prisma-${{ github.run_id }}.tgz'" || true

  # ══════════════════════════════════════════════════════════════════════════
  # 4. SMOKE — vérification applicative via l'ingress (staging privé → tailnet)
  # ══════════════════════════════════════════════════════════════════════════
  smoke:
    name: Smoke test staging
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Staging est derrière internal-only@nomad (ipAllowList 100.64/10) : le
      # curl échoue en 403 SANS tailscale. Le runner rejoint le tailnet Veridian.
      - name: Tailscale (connect runner to tailnet for staging smoke)
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci-github
          version: latest

      - name: GET /api/health (retry 6x/5s)
        run: |
          for i in $(seq 1 6); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://${{ env.STAGING_HOST }}/api/health" || echo "000")
            echo "[$i/6] /api/health → $CODE"
            if [ "$CODE" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Smoke /api/health failed"
          exit 1

      - name: GET /api/auth/providers
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://${{ env.STAGING_HOST }}/api/auth/providers")
          [ "$CODE" = "200" ] || { echo "::error::auth providers → $CODE"; exit 1; }

      - name: GET /login (page render)
        run: |
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://${{ env.STAGING_HOST }}/login")
          [ "$CODE" = "200" ] || { echo "::error::/login → $CODE"; exit 1; }

  # NOTE — le dashboard-crawler Playwright a été RETIRÉ de ce workflow.
  # Il dépendait de la topologie compose morte (réseau docker `staging-edge` +
  # DNS interne `postgres-staging:5432` pour seeder le compte canonique), qui
  # n'existe plus dans le modèle Nomad (la DB vit dans le namespace réseau de
  # l'alloc). Le crawler reste disponible en local/manuel, et la couverture E2E
  # lourde (scripts/e2e/staging-full.sh) demeure le gate team-lead avant promo
  # main (§20, exécuté à la main). Recâbler un crawler Nomad-aware = ticket
  # dédié si besoin (container Playwright joignant `--network container:db-<alloc>`).
