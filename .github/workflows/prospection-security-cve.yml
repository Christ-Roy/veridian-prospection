name: Prospection — security CVE (Trivy)

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Detecte les CVE upstream apparues apres le dernier merge.
    # Si une nouvelle CRIT/HIGH sort sur Next.js entre 2 builds, ce cron fail
    # et ouvre une issue GitHub auto. L'agent CI bump alors la dep.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: security-cve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    name: Trivy scan (CRITICAL+HIGH bloquant)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # pour upload SARIF dans Security tab
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra — requis par le build (@veridian/shared)
          token: ${{ secrets.CR_PAT }}  # accès cross-repo au submodule privé

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally (no push, scan-only)
        id: build   # référencé par l'étape SARIF : sans image construite, rien à scanner
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: prospection:${{ github.sha }}
          # Le scan ne vaut que s'il mesure la MÊME image que celle publiée.
          # prospection-ci.yml exclut le stage `runner` du cache et re-résout la
          # base ; sans les mêmes options ici, on scannerait une image qui n'est
          # pas celle qui part en production.
          no-cache-filters: runner
          pull: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://api.app.veridian.site
            NEXT_PUBLIC_HUB_URL=https://app.veridian.site
            NEXT_PUBLIC_SITE_URL=https://prospection.app.veridian.site
            NEXT_PUBLIC_TRIAL_DAYS=7

      - name: Smoke Sharp in delivered Alpine image
        run: |
          docker run --rm --entrypoint node "prospection:${{ github.sha }}" -e '
            const sharp = require("sharp");
            if (sharp.versions.sharp !== "0.35.0") {
              throw new Error(`Unexpected Sharp version: ${sharp.versions.sharp}`);
            }
            sharp({
              create: {
                width: 2,
                height: 2,
                channels: 4,
                background: { r: 255, g: 0, b: 0, alpha: 1 },
              },
            })
              .png()
              .toBuffer()
              .then((buffer) => {
                if (buffer.length === 0) throw new Error("Sharp returned an empty PNG");
                console.log(`Sharp ${sharp.versions.sharp}, libvips ${sharp.versions.vips}, PNG ${buffer.length} bytes`);
              })
              .catch((error) => {
                console.error(error);
                process.exit(1);
              });
          '

      - name: Trivy — scan image (CRITICAL+HIGH bloquant, ignore-unfixed)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'prospection:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          # Cache Trivy DB pour eviter rate-limit GitHub Advisory API
          cache: 'true'

      # 🔴 `always()` SEUL FAISAIT MENTIR CE JOB, et c'est ce qui a coûté le
      # plus de temps le 2026-09-07. Quand le `checkout` échoue, la
      # construction de l'image est SAUTÉE et le scan bloquant ci-dessus l'est
      # aussi — mais cette étape-ci, elle, s'exécutait quand même et échouait
      # sur `unable to find the specified image "prospection:<sha>"`. Le job
      # ressortait donc rouge sous l'intitulé « Trivy scan (CRITICAL+HIGH
      # bloquant) », ce qui se lit comme une CVE critique alors que RIEN
      # n'avait été mesuré. Deux agents ont cherché des vulnérabilités qui
      # n'existaient pas avant de remonter à un clone de sous-module en échec.
      #
      # On garde `always()` — le rapport doit être publié même quand le scan
      # bloquant trouve des CVE et sort en 1, c'est tout son intérêt — mais on
      # exige que l'image existe. Si la construction n'a pas eu lieu, l'étape
      # est sautée et le job échoue sur la VRAIE étape, avec son vrai message.
      #
      # ⚠️ Ceci n'assouplit AUCUN garde-fou : le job échoue toujours (fermé)
      # quand le checkout ou la construction échoue. Seul l'intitulé de la
      # cause change, et il devient exact.
      - name: Trivy — SARIF report (Security tab)
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'prospection:${{ github.sha }}'
          severity: 'CRITICAL,HIGH,MEDIUM'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security tab
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true  # repo privé peut bloquer l'upload, scan reste autoritaire
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-prospection'

  # Scan de l'image RÉELLEMENT DÉPLOYÉE en prod (cron quotidien).
  #
  # 🔴 CE JOB A MENTI PENDANT QUATRE NUITS (30/08 → 02/09/2026). Il lisait le
  # tag dans `infra/docker-compose.yml`, hérité de l'époque Dokploy :
  #   1. ce fichier n'est plus la source de vérité — le déploiement passe par le
  #      job Nomad versionné, qui épingle l'image PAR DIGEST ;
  #   2. la valeur lue était la chaîne littérale
  #      `ghcr.io/christ-roy/prospection:${PROSPECTION_IMAGE_TAG:-latest}`, non
  #      substituée, donc `docker pull` rendait « denied ».
  # Résultat : un rouge quotidien qui ressemblait à une alerte CVE et n'était
  # qu'une panne d'outil, pendant que l'image de production n'était plus scannée
  # du tout. Un contrôle qui vise la mauvaise cible ne mesure rien, même en
  # fonctionnant parfaitement.
  #
  # La source de vérité est désormais le jobspec Nomad. La lecture est
  # fail-closed : un digest introuvable rend 2 (MESURE NON ABOUTIE), jamais un
  # vert et jamais un rouge trompeur.
  trivy-deployed:
    name: Trivy scan — image déployée en prod (digest Nomad, cron)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # pour login + pull GHCR private
    steps:
      - uses: actions/checkout@v6

      - name: Checkout du dépôt des jobs Nomad (source de vérité du déploiement)
        uses: actions/checkout@v6
        with:
          repository: Christ-Roy/nomad-veridian
          token: ${{ secrets.CR_PAT }}
          path: .nomad-veridian
          # 🔴 `master`, PAS `main`. La branche par défaut de nomad-veridian est
          # `master` et il n'existe AUCUNE branche `main` : le fetch de
          # `refs/heads/main*` ne ramenait rien et le job mourait sur un
          # `exit 1` avant d'avoir résolu le moindre digest.
          #
          # Ce que ça a coûté, parce que c'est le vrai enseignement : ce job
          # avait été « réparé » le 2026-09-02 (commit 91ba433e), et c'est
          # CETTE réparation qui a introduit `ref: main`. Le commentaire en
          # tête du job raconte qu'il avait menti quatre nuits ; il a continué
          # à mentir toutes les nuits suivantes, pour une autre raison, sans
          # que le rouge change d'apparence. Mesuré le 2026-09-07 : 60
          # exécutions planifiées listées, 60 échecs, aucune verte, jusqu'au
          # 2026-07-10. Le scan de l'image de production n'a JAMAIS fonctionné.
          #
          # La leçon : réparer un contrôle ne se prouve pas en relisant le
          # YAML, seulement en le voyant passer au vert.
          ref: master

      # 🔴 CR_PAT, PAS GITHUB_TOKEN — la couche d'échec SUIVANTE, que `ref: main`
      # masquait depuis le 02/09 en tuant le job avant d'arriver ici.
      # Avec `GITHUB_TOKEN`, `docker pull` sur le digest rend « manifest
      # unknown », ce qui se lit comme « l'image n'existe pas » et ne l'est pas :
      # mesuré le 2026-09-07, le même digest rend HTTP 200 sur l'API du registre
      # avec `CR_PAT` (contrôle négatif à côté : un digest inventé rend bien
      # 404, donc l'instrument discrimine). Le `packages: read` du workflow ne
      # suffit pas — l'accès à GHCR se donne PAR PAQUET.
      # `CR_PAT` est déjà le jeton utilisé plus haut pour le sous-module privé.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: Christ-Roy
          password: ${{ secrets.CR_PAT }}

      - name: Résoudre l'image déployée depuis le jobspec Nomad
        id: image
        run: |
          set -euo pipefail
          SPEC=.nomad-veridian/jobs/saas-prod/prospection.nomad.hcl
          if [ ! -f "$SPEC" ]; then
            echo "::error::Jobspec $SPEC introuvable — MESURE NON ABOUTIE, l'image déployée n'est ni confirmée ni infirmée."
            exit 2
          fi
          # On exige un digest : un tag mouvant ne prouve pas ce qui tourne.
          IMG=$(grep -oE 'ghcr\.io/christ-roy/prospection@sha256:[0-9a-f]{64}' "$SPEC" | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::Aucune image épinglée par digest dans $SPEC — MESURE NON ABOUTIE."
            echo "::error::Le jobspec contient pourtant $(grep -c 'image' "$SPEC") lignes 'image' : ce n'est pas un défaut de lecture."
            exit 2
          fi
          echo "Image déployée (digest du jobspec Nomad) : $IMG"
          echo "ref=$IMG" >> "$GITHUB_OUTPUT"

      - name: Pull image (private GHCR)
        run: docker pull ${{ steps.image.outputs.ref }}

      - name: Trivy scan deployed image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
