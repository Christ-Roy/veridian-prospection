# CI/CD pipeline — Veridian Prospection (post-extraction monorepo 2026-05-13)
#
# Déclenche :
#   - push main      → pipeline complet + build/push GHCR :latest (deploy prod manuel via §20)
#   - PR vers main   → pipeline complet (quality gate validation)
#   - workflow_dispatch
#
# Jobs (sériels) :
#   1. quality     : test-mapping (1-pour-1 strict) + tsc + eslint + vitest unit + Supabase guard  (~60s)
#   2. audit       : npm audit + CVE high/critical bloquant via _audit-cve.yml                     (~30s)
#   3. build       : npm run build (Next.js standalone)                                            (~90s)
#   4. integration : vitest e2e/integration vs Postgres éphémère                                   (~60s)
#   5. docker      : buildx + push GHCR (latest + sha) + cache GHA (push main uniquement)          (~3min cold / ~30s warm)
#   6. deploy-prod : SSH bastion → nomad job plan/run prospection + prisma migrate (push main)      (~1-2min)
#
# Promotion prod (modèle gitops Nomad SSH-bastion — 2026-07-11) :
#   Sur push main, `docker` build+push l'image GHCR (:latest + :<sha>) puis
#   `deploy-prod` déploie le job Nomad `prospection` via SSH vers le bastion
#   Contabo (même patron que le staging). Fini Dokploy : plus de webhook stale,
#   plus de compose.deploy API. Le NOMAD_TOKEN ne quitte jamais le bastion.
#   La DB prod est co-localisée avec l'app dans le job Nomad (postgres:15 sur le
#   bastion) ; le `prisma migrate deploy` tourne EN LOCAL sur le bastion dans un
#   container éphémère joignant `--network container:prospection-saas-db-<alloc>`.
#   Cf. deploy/README.md (runbook de référence) + §20 CI-ARCHITECTURE (promotion
#   graduée : la promo main est déclenchée par l'agent, pas en auto-merge).

name: Prospection CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: christ-roy/prospection
  PROD_HOST: prospection.app.veridian.site

jobs:
  quality:
    name: Quality gate (test-mapping + tsc + eslint + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history pour test-mapping vs origin/main
          submodules: recursive  # shared/ submodule veridian-infra

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci

      - name: test-mapping (1-pour-1 strict, dette acceptée via pending list)
        env:
          BASE_REF: origin/main
        run: bash scripts/ci/check-test-mapping.sh

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: eslint src/
        run: npx eslint src/ --quiet

      - name: vitest unit tests (src/**/*.test.ts)
        run: npx vitest run src/

  audit:
    name: CVE audit (high+critical bloquant)
    uses: ./.github/workflows/_audit-cve.yml
    with:
      app-path: .
      package-manager: npm
      node-version: "20"
      omit-dev: true

  build:
    needs: [quality, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  integration:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: prospection_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply schema
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/prospection_test
        run: npx prisma db push --accept-data-loss --skip-generate
      - name: Run integration tests (parallel — disjoint tenant_id + SIREN prefixes)
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/prospection_test
        run: |
          # tenant-isolation uses tenants aaaa/bbbb + SIREN prefix 998.
          # workspace-isolation uses tenants cccc/dddd + SIREN prefix 999.
          # No overlap → safe to run in parallel (vitest default).
          npx vitest run e2e/integration/tenant-isolation.test.ts e2e/integration/workspace-isolation.test.ts

  # ── Build + push image GHCR (sur push main uniquement) ──────────────────
  docker:
    name: Build + push GHCR (latest + sha)
    needs: [build, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha7: ${{ steps.sha.outputs.sha7 }}
    steps:
      - id: sha
        run: echo "sha7=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          submodules: recursive  # shared/ submodule veridian-infra

      - uses: docker/setup-buildx-action@v3

      # CR_PAT (Personal Access Token user-level) au lieu de GITHUB_TOKEN :
      # le package ghcr.io/christ-roy/prospection est encore lié au repo legacy
      # Christ-Roy/prospection (pré-monorepo), GITHUB_TOKEN de ce repo ne push pas.
      # À nettoyer un jour : transférer le package GHCR vers veridian-prospection.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - id: build_time
        run: echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://api.app.veridian.site
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_HUB_URL=https://app.veridian.site
            NEXT_PUBLIC_SITE_URL=https://prospection.app.veridian.site
            NEXT_PUBLIC_TRIAL_DAYS=7
            COMMIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.build_time.outputs.built_at }}

      # NB : plus aucun trigger Dokploy ici. Le déploiement prod est pris en
      # charge par le job `deploy-prod` ci-dessous (Nomad SSH-bastion). Ce job
      # `docker` ne fait QUE build+push l'image GHCR (:latest + :<sha7>).

  # ══════════════════════════════════════════════════════════════════════════
  # 6. DEPLOY NOMAD PROD (SSH bastion) — remplace l'ancien trigger Dokploy
  # ══════════════════════════════════════════════════════════════════════════
  # Même patron que le deploy staging (deploy/README.md), avec les différences
  # d'environnement prod :
  #   - JOB_FILE = deploy/prospection.nomad.hcl  (job Nomad "prospection")
  #   - IMAGE_TAG = <sha7> SANS préfixe (metadata type=sha,prefix= côté docker)
  #   - Prod PUBLIQUE : pas de middleware internal-only → curl direct, PAS de tailscale.
  #   - DB prod co-localisée SUR LE BASTION (provider=contabo) → le migrate tourne
  #     EN LOCAL sur le bastion (pas de hop dev-pub), container DB
  #     `prospection-saas-db-<alloc>`, user `postgres`, db `prospection`.
  deploy-prod:
    name: Deploy Nomad prod (SSH bastion)
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.docker.outputs.sha7 }}
      NOMAD_JOB: prospection
      JOB_FILE: deploy/prospection.nomad.hcl
      REMOTE_HCL: /tmp/prospection-${{ github.run_id }}.nomad.hcl
      PROD_URL: https://prospection.app.veridian.site
    steps:
      - uses: actions/checkout@v6
        # Le HCL vit dans le repo (deploy/) — pas besoin du submodule ici.

      - name: Install SSH key (bastion Nomad)
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NOMAD_DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NOMAD_BASTION_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # ⚠️ On copie le HCL DU REPO (qui déclare `variable "image_tag"`), jamais
      # la copie bastion ~/nomad-veridian/jobs/ (plus vieille, sans la variable).
      - name: Copy HCL to bastion
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$JOB_FILE" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:$REMOTE_HCL"

      - name: nomad job plan (dry-run) + run -detach
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          REMOTE_HCL: ${{ env.REMOTE_HCL }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "IMAGE_TAG='${IMAGE_TAG}' REMOTE_HCL='${REMOTE_HCL}' bash -s" <<'REMOTE'
          set -euo pipefail
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"
          # ── PRÉ-PULL authentifié sur le nœud cible (prod = LE BASTION, provider=contabo) ──
          # Nomad ne pull pas les images PRIVÉES ghcr (plugin sans bloc auth). On
          # pré-pull EN LOCAL sur le bastion (auth ghcr en place) → image déjà
          # présente quand la task démarre. Cf deploy/README.md §ghcr auth.
          echo "== pré-pull image prod sur le bastion (auth ghcr local) =="
          docker pull "ghcr.io/christ-roy/prospection:${IMAGE_TAG}"
          echo "== nomad job validate =="
          /usr/bin/nomad job validate -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL"
          echo "== nomad job plan (diff, inoffensif) =="
          # plan renvoie exit 1 quand il y a des allocs à créer : by design → `|| true`.
          /usr/bin/nomad job plan -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" || true
          # Déploiement + vérification CIBLÉE (cf staging) : run -detach → résout le
          # Deployment de cet eval → `deployment status -monitor <id>` (bloque, exit
          # ≠0 si échec/auto-revert). Évite la race du poll (faux positif) ET le 404
          # du `job run` bloquant (faux négatif) — incident 2026-07-11.
          # ⚠️ Job prod STATEFUL (DB co-localisée, count=1) → un run recrée l'alloc
          # (bref redémarrage DB, attendu, pas zéro-downtime).
          echo "== nomad job run -detach + monitoring du déploiement ciblé (image_tag=${IMAGE_TAG}) =="
          EVAL=$(/usr/bin/nomad job run -detach -var "image_tag=${IMAGE_TAG}" "$REMOTE_HCL" | grep -oP 'Evaluation ID:\s+\K\S+')
          echo "eval: ${EVAL:-none}"
          DEP=""
          for i in $(seq 1 15); do
            DEP=$(/usr/bin/nomad eval status -json "$EVAL" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("DeploymentID") or "")' 2>/dev/null || true)
            [ -n "$DEP" ] && break
            sleep 2
          done
          if [ -z "$DEP" ]; then
            echo "Pas de déploiement créé (job inchangé = no-op) → OK"
          else
            echo "deployment: $DEP — monitoring jusqu'à terminal…"
            /usr/bin/nomad deployment status -monitor "$DEP"
          fi
          REMOTE

      # ── Prisma migrate deploy (gate idempotent) ────────────────────────────
      # DB prod co-localisée sur le bastion → migrate en LOCAL (pas de hop dev-pub).
      # Container éphémère joignant `--network container:prospection-saas-db-<alloc>`.
      # Mot de passe lu in situ depuis l'env du container postgres. Idempotent
      # (prod baseline 31/31 → no-op au 1er run).
      - name: Ship prisma/ to bastion
        run: |
          tar czf /tmp/prisma-${{ github.run_id }}.tgz prisma
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "/tmp/prisma-${{ github.run_id }}.tgz" \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}:/tmp/prisma-${{ github.run_id }}.tgz"

      - name: Prisma migrate deploy (DB prod locale au bastion)
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "NOMAD_JOB='${{ env.NOMAD_JOB }}' RUN_ID='${{ github.run_id }}' bash -s" <<'REMOTE'
          set -euo pipefail
          source ~/credentials/nomad-bastion.env
          export NOMAD_ADDR NOMAD_TOKEN="$NOMAD_MGMT_TOKEN"

          ALLOC=$(/usr/bin/nomad job allocs -json "$NOMAD_JOB" \
            | python3 -c 'import sys,json;a=json.load(sys.stdin);print([x["ID"] for x in a if x["ClientStatus"]=="running"][0])')
          DB_CT="prospection-saas-db-${ALLOC}"
          echo "db container: $DB_CT"

          WORK="/tmp/prosp-migrate-${RUN_ID}"
          rm -rf "$WORK" && mkdir -p "$WORK"
          tar xzf "/tmp/prisma-${RUN_ID}.tgz" -C "$WORK"
          DB_PASS=$(docker exec "$DB_CT" printenv POSTGRES_PASSWORD)
          docker run --rm \
            --network "container:$DB_CT" \
            -v "$WORK/prisma:/app/prisma" \
            -w /app \
            -e DATABASE_URL="postgresql://postgres:$DB_PASS@127.0.0.1:5432/prospection?connection_limit=5" \
            node:22-alpine sh -c 'apk add --no-cache openssl >/dev/null && npm i -g prisma@6.19.2 --silent && prisma migrate deploy'
          rm -rf "$WORK" "/tmp/prisma-${RUN_ID}.tgz"
          REMOTE

      # ── Smoke prod (public, pas de tailscale) + anti-stale SHA ─────────────
      - name: Smoke /api/health (retry 6x/5s)
        run: |
          for i in $(seq 1 6); do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$PROD_URL/api/health" || echo "000")
            echo "[$i/6] /api/health → $CODE"
            if [ "$CODE" = "200" ]; then break; fi
            [ "$i" = "6" ] && { echo "::error::Smoke /api/health failed"; exit 1; }
            sleep 5
          done

      - name: Verify active SHA (anti-stale, remplace le poll Dokploy)
        env:
          EXPECTED_SHA: ${{ needs.docker.outputs.sha7 }}
        run: |
          echo "Attente bascule container → SHA $EXPECTED_SHA (max 120s)"
          for i in $(seq 1 12); do
            ACTUAL=$(curl -fsS --max-time 5 "$PROD_URL/api/version" 2>/dev/null \
              | jq -r '.commit_sha[0:7]' 2>/dev/null || echo "stale")
            if [ "$ACTUAL" = "$EXPECTED_SHA" ]; then
              echo "✓ Container prod au SHA $ACTUAL (tentative $i/12)"
              exit 0
            fi
            echo "[$i/12] container à '$ACTUAL', attendu '$EXPECTED_SHA'"
            sleep 10
          done
          echo "::error::Container prod n'a pas basculé sur $EXPECTED_SHA en 120s"
          curl -sS "$PROD_URL/api/version" || true
          exit 1

      - name: Cleanup remote HCL
        if: always()
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            "${{ secrets.NOMAD_BASTION_USER }}@${{ secrets.NOMAD_BASTION_HOST }}" \
            "rm -f '$REMOTE_HCL' '/tmp/prisma-${{ github.run_id }}.tgz'" || true
