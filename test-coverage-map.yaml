    - src/components/atlas/vue-marche.tsx
    - src/components/atlas/icones.tsx
    - src/components/atlas/brancher-ia.tsx
    - src/components/atlas/rail.tsx
    - src/components/atlas/carte.tsx
    - src/components/atlas/vues.tsx
