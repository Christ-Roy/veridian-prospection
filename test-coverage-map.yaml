# = AUCUN cap visible". 5 fichiers modifiés, couverts par 3 tests dédiés à
# l'audit (matrice 7 plans payants + cache invalidation) plutôt que par les tests
# canoniques (qui restent pertinents pour le comportement non-trial).
- sources:
    - src/app/api/tenants/[id]/credit-leads/route.ts
  covered_by:
    - __tests__/api/tenants/[id]/credit-leads.test.ts
    - __tests__/api/tenants/[id]/credit-leads-filters.test.ts
  reason: |
    La route credit-leads a 2 surfaces : (1) le contrat v2.0 historique
    (HMAC entrant + idempotency + welcome double-grant) couvert par
    credit-leads.test.ts ; (2) l'extension v2.1 `filters` (LeadOrder
    persisté pour les achats refill ICP) couverte par
    credit-leads-filters.test.ts. Les 2 tests sont complémentaires :
    canonique = invariants existants, filters = nouvel ajout v2.1.

